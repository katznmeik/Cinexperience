# 4-core / 15 GB cloud machine and typical dev PCs: 4 GB for the daemon is plenty.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# App version (MAJOR.MINOR.PATCH). versionCode is derived from it in app/build.gradle.kts,
# and a release is published by pushing the tag v<this version> (.github/workflows/release.yml).
cinexVersionName=1.0.0
