name: Android CI

on:
  push:
    branches: ["claude/**"]
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # A claude/** branch in this repo already builds on push; skip its duplicate PR run.
    if: github.event_name == 'push' || !(startsWith(github.head_ref, 'claude/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING_KEY: ${{ secrets.CINEX_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" "build-tools;36.1.0"

      - name: Unit tests and screenshots
        run: ./gradlew testDebugUnitTest recordRoborazziDebug --stacktrace

      - name: Decode signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          CINEX_KEYSTORE_BASE64: ${{ secrets.CINEX_KEYSTORE_BASE64 }}
        run: |
          echo "$CINEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinexperience-release.jks"
          echo "CINEX_KEYSTORE_PATH=$RUNNER_TEMP/cinexperience-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          # Fail instead of silently falling back to debug signing if any secret is missing.
          CINEX_REQUIRE_RELEASE_SIGNING: "true"
          CINEX_KEYSTORE_PASSWORD: ${{ secrets.CINEX_KEYSTORE_PASSWORD }}
          CINEX_KEY_ALIAS: ${{ secrets.CINEX_KEY_ALIAS }}
          CINEX_KEY_PASSWORD: ${{ secrets.CINEX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cinexperience-${GITHUB_SHA::7}.apk"

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::warning::Signing secrets are not configured - uploading a DEBUG APK instead of a signed release."
          ./gradlew assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/cinexperience-${GITHUB_SHA::7}-debug.apk"

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cinexperience-release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cinexperience-apk-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: "**/build/outputs/roborazzi/*.png"
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
