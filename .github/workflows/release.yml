name: Release

# Publishes a version: push a tag v<cinexVersionName> (e.g. v1.0.0) and this
# workflow runs the tests and lint, builds the APK signed with the fixed release
# key and creates the GitHub Release for that tag with cinexperience-<version>.apk.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag must match the app version
        run: |
          version="$(sed -n 's/^cinexVersionName=//p' gradle.properties)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match cinexVersionName=$version in gradle.properties (expected v$version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" "build-tools;36.1.0"

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Decode signing key
        env:
          CINEX_KEYSTORE_BASE64: ${{ secrets.CINEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CINEX_KEYSTORE_BASE64" ]; then
            echo "::error::The CINEX_KEYSTORE_BASE64 secret is missing: a release must be signed with the fixed key."
            exit 1
          fi
          echo "$CINEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinexperience-release.jks"
          echo "CINEX_KEYSTORE_PATH=$RUNNER_TEMP/cinexperience-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          # Fail instead of falling back to debug signing if any secret is missing.
          CINEX_REQUIRE_RELEASE_SIGNING: "true"
          CINEX_KEYSTORE_PASSWORD: ${{ secrets.CINEX_KEYSTORE_PASSWORD }}
          CINEX_KEY_ALIAS: ${{ secrets.CINEX_KEY_ALIAS }}
          CINEX_KEY_PASSWORD: ${{ secrets.CINEX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cinexperience-$VERSION.apk"

      - name: Verify the APK signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/36.1.0/apksigner"
          "$apksigner" verify --print-certs "dist/cinexperience-$VERSION.apk" | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cinexperience-release.jks"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/cinexperience-$VERSION.apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          cat > notes.md <<EOF
          Cinexperience $VERSION for Android 14 and newer.

          **Install or update:** open this page on the phone, download \`cinexperience-$VERSION.apk\` below and open it. See the [README](https://github.com/$GITHUB_REPOSITORY#install-and-update) for Samsung Auto Blocker and Play Protect.

          **Updating keeps your data** (every release is signed with the same key). As a precaution, make a backup first: Settings → Export backup.

          SHA-256 of the APK: \`$sha\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --verify-tag \
            --title "Cinexperience $VERSION" \
            --notes-file notes.md

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.ref_name }}
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
