name: Release

# Publishes a version: push a tag v<cinexVersionName> (e.g. v1.0.0), or run this
# workflow from the Actions tab (Run workflow) on the default branch with that
# version. It runs the tests and lint, builds the APK signed with the fixed
# release key and creates the GitHub Release with cinexperience-<version>.apk.
# A manual run releases the commit it built and creates the tag v<version> on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, equal to cinexVersionName in gradle.properties (e.g. 1.0.0)"
        required: true
        type: string

# One release at a time, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        # bash -eo pipefail: a failing command in a pipeline fails the step.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Tag must match the app version
        env:
          # Passed through the environment, never pasted into the script.
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^cinexVersionName=//p' gradle.properties)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "::error::Run the release on the default branch ($DEFAULT_BRANCH), not $GITHUB_REF_NAME."
              exit 1
            fi
            tag="v$INPUT_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match cinexVersionName=$version in gradle.properties (expected v$version)."
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run creates the tag, so it must not exist yet.
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq "map(select(.ref == \"refs/tags/$tag\")) | length")"
            if [ "$existing" != "0" ]; then
              echo "::error::Tag $tag already exists. Raise cinexVersionName for a new release."
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" "build-tools;36.1.0"

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Decode signing key
        env:
          CINEX_KEYSTORE_BASE64: ${{ secrets.CINEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$CINEX_KEYSTORE_BASE64" ]; then
            echo "::error::The CINEX_KEYSTORE_BASE64 secret is missing: a release must be signed with the fixed key."
            exit 1
          fi
          echo "$CINEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cinexperience-release.jks"
          echo "CINEX_KEYSTORE_PATH=$RUNNER_TEMP/cinexperience-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          # Fail instead of falling back to debug signing if any secret is missing.
          CINEX_REQUIRE_RELEASE_SIGNING: "true"
          CINEX_KEYSTORE_PASSWORD: ${{ secrets.CINEX_KEYSTORE_PASSWORD }}
          CINEX_KEY_ALIAS: ${{ secrets.CINEX_KEY_ALIAS }}
          CINEX_KEY_PASSWORD: ${{ secrets.CINEX_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/cinexperience-$VERSION.apk"

      # Fails unless the APK verifies and its only signer is the release certificate
      # in signing/release-cert.sha256 (otherwise it would not install as an update).
      - name: Verify the APK is signed with the release key
        run: scripts/verify-release-apk.sh "dist/cinexperience-$VERSION.apk"

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/cinexperience-release.jks"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="dist/cinexperience-$VERSION.apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          cat > notes.md <<EOF
          Cinexperience $VERSION for Android 14 and newer.

          **Install or update:** open this page on the phone, download \`cinexperience-$VERSION.apk\` below and open it. See the [README](https://github.com/$GITHUB_REPOSITORY#install-and-update) for Samsung Auto Blocker and Play Protect.

          **Updating keeps your data** (every release is signed with the same key). As a precaution, make a backup first: Settings → Export backup.

          SHA-256 of the APK: \`$sha\`
          EOF
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Creates the tag on the commit this run tested and built.
            tag_option=(--target "$GITHUB_SHA")
          else
            tag_option=(--verify-tag)
          fi
          gh release create "$TAG" "$apk" \
            "${tag_option[@]}" \
            --title "Cinexperience $VERSION" \
            --notes-file notes.md

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # The run id: a branch name (manual run) may contain "/".
          name: release-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
